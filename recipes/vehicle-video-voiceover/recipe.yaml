# Goose recipe: Vehicle Video — voiceover script
#
# Step 3 of the vehicle-video pipeline, run ONCE after the operator has approved
# the final set of section clips. Stitches the approved shots' narration (in
# playback order) into one flowing, TTS-ready voiceover script, held within the
# clips' combined duration so it never overruns the video. The module then calls
# Gemini TTS with the result during final composition.
#
# The tone + length contract lives in the vehicle-video-voiceover skill
# (auto-loaded).
#
# To run in Gatewaze:
#   POST /api/modules/ai/admin/recipes/:id/run
#     { "use_case": "vehicle-video-voiceover",
#       "params": { "shots": "[...]", "total_duration_seconds": "32",
#                   "vehicle": "{...}" } }

version: "1.0.0"
title: "Vehicle Video — voiceover script"
description: "Combines the approved shots' narration (in final order) into one flowing, TTS-ready voiceover script for the composed video, kept within the total clip duration so the narration never overruns."

parameters:
  - key: shots
    input_type: string
    requirement: required
    description: "JSON-encoded array of approved shots in playback order: [{ scene_title, narration }]."
  - key: total_duration_seconds
    input_type: string
    requirement: required
    description: "Combined duration of the approved clips, in seconds. The voiceover must be speakable within this at a natural pace."
  - key: vehicle
    input_type: string
    requirement: required
    description: "JSON-encoded vehicle identification: { year, make, model, trim }."
  - key: style
    input_type: string
    requirement: optional
    description: "JSON style knobs { tone, pacing } from the style step. The voiceover must be written in this tone; pacing informs sentence rhythm."
  - key: style_template
    input_type: string
    requirement: optional
    description: "Body of the resolved style-template skill, piped by the module, for tone consistency."

settings:
  goose_provider: anthropic
  goose_model: claude-sonnet-4-5

instructions: |
  Follow the vehicle-video-voiceover skill (auto-loaded) — it holds the tone,
  TTS-readability, and hard length constraint.

  Total video duration: {{ total_duration_seconds }} seconds.

  Vehicle:
  {{ vehicle }}

  Write in this style — tone/pacing knobs: {{ style }}
  Style treatment:
  {{ style_template }}

  Approved shots in playback order:
  {{ shots }}

  Emit the single voiceover script and its word count via the response schema.

prompt: |
  Write the final voiceover script for this video.

response:
  json_schema:
    type: object
    required: [voiceover, word_count]
    properties:
      voiceover:
        type: string
        description: "The final narration as one plain-text block, TTS-ready."
      word_count:
        type: integer
        description: "Word count of voiceover, for the module to sanity-check against duration."
